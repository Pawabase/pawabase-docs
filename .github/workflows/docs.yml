name: docs
# Mintlify deploys the site from the main branch through its GitHub app.
# This workflow keeps main healthy: every pull request must validate and have no broken links.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx mint validate
      - run: npx mint broken-links
